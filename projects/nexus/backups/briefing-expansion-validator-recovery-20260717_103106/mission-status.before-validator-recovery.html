<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="0; url=index.html">
<title>Mission Status | NEXUS</title>
<style id="nexus-briefing-expansion-contract">
  .nexus-briefing-expandable {
    cursor: zoom-in;
  }

  .nexus-briefing-overlay {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(3, 12, 21, 0.94);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .nexus-briefing-overlay.is-open {
    display: flex;
  }

  .nexus-briefing-overlay img {
    display: block;
    width: auto;
    height: auto;
    max-width: min(96vw, 1800px);
    max-height: 94vh;
    object-fit: contain;
    cursor: zoom-out;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.62);
  }

  .nexus-briefing-overlay-close {
    position: fixed;
    top: 18px;
    right: 22px;
    z-index: 100000;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px;
    width: 42px;
    height: 42px;
    background: rgba(7, 20, 31, 0.88);
    color: #ffffff;
    font: 300 28px/38px Arial, sans-serif;
    text-align: center;
    cursor: pointer;
  }

  body.nexus-briefing-overlay-open {
    overflow: hidden;
  }
</style>
</head>
<body>
<p>Redirecting to <a href="index.html">NEXUS Mission Status</a>...</p>
<div
  class="nexus-briefing-overlay"
  id="nexus-briefing-overlay"
  role="dialog"
  aria-modal="true"
  aria-label="Expanded NEXUS briefing"
>
  <button
    class="nexus-briefing-overlay-close"
    id="nexus-briefing-overlay-close"
    type="button"
    aria-label="Close expanded briefing"
  >×</button>

  <img
    id="nexus-briefing-overlay-image"
    src=""
    alt=""
  >
</div>

<script id="nexus-briefing-expansion-runtime">
(function () {
  "use strict";

  var overlay = document.getElementById("nexus-briefing-overlay");
  var overlayImage = document.getElementById("nexus-briefing-overlay-image");
  var closeButton = document.getElementById("nexus-briefing-overlay-close");

  if (!overlay || !overlayImage || !closeButton) {
    return;
  }

  var candidates = Array.prototype.slice.call(
    document.querySelectorAll("main img, .page img, .content img, article img, section img")
  ).filter(function (image) {
    return (
      image &&
      image.src &&
      image.naturalWidth !== 0 &&
      !image.closest("#nexus-briefing-overlay")
    );
  });

  candidates.forEach(function (image) {
    image.classList.add("nexus-briefing-expandable");
    image.setAttribute("tabindex", "0");
    image.setAttribute("role", "button");
    image.setAttribute("aria-label", "Open expanded briefing");

    function openBriefing() {
      overlayImage.src = image.currentSrc || image.src;
      overlayImage.alt = image.alt || "Expanded NEXUS briefing";
      overlay.classList.add("is-open");
      document.body.classList.add("nexus-briefing-overlay-open");
      closeButton.focus();
    }

    image.addEventListener("click", openBriefing);

    image.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openBriefing();
      }
    });
  });

  function closeBriefing() {
    overlay.classList.remove("is-open");
    document.body.classList.remove("nexus-briefing-overlay-open");
    overlayImage.src = "";
  }

  closeButton.addEventListener("click", closeBriefing);

  overlay.addEventListener("click", function (event) {
    if (
      event.target === overlay ||
      event.target === overlayImage
    ) {
      closeBriefing();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (
      event.key === "Escape" &&
      overlay.classList.contains("is-open")
    ) {
      closeBriefing();
    }
  });
}());
</script>
</body>
</html>
