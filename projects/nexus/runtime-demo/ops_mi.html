<title>NEXUS Operations MI</title>
<meta name="description" content="Operations management information for NEXUS: backlog, aging, SLA position, team load, SAR pipeline and QA oversight, for the demo desk and for a batch estate at scale.">

<style>
/* Layout: header with scope switch and provenance; a one-line verdict; six summary figures; then a grid of MI panels for the chosen scope. One dark NEXUS look: blue for intake, gold for decisions and authority, coral for what needs action. */
:root {
  --bg: #060910; --surface: #0b1220; --raised: #0d1626; --line: #172131; --line-2: #22314a;
  --fg: #eaf1f9; --fg-2: #c9d5e4; --muted: #a7b7cd; --faint: #8d9db3; --ghost: #6f8199;
  --blue: #79c4ff; --blue-ink: #06192e; --gold: #e9c877; --gold-ink: #1a1405;
  --warn: #ff8f6b; --ok: #4fdca0; --crit: #ff5d6c; --void: #3a4a60;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans) }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.wrap { max-width: 1360px; margin: 0 auto; padding-inline: 20px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
header { border-bottom: 1px solid var(--line); background: #0a0f19 }
header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding-block: 14px }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto }
.brand b { display: block; letter-spacing: .2em; font-size: 17px }
.brand small { display: block; font-size: 11px; color: var(--muted) }
.seg { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line-2); border-radius: 11px; background: var(--raised) }
.seg button { min-height: 38px; padding: 6px 14px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 600; background: transparent; color: var(--fg-2) }
.seg button[aria-pressed="true"] { background: var(--blue); color: var(--blue-ink) }
.pill { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; background: var(--raised) }
main { display: flex; flex-direction: column; gap: 18px; padding-block: 22px 44px }
h1 { margin: 0; font-size: 26px; line-height: 1.2; text-wrap: balance }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 82ch }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px }
.kpi .l { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.kpi .v { font: 600 30px var(--mono); margin-top: 4px }
.kpi .s { font-size: 12px; color: var(--faint); margin-top: 2px }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 18px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0 }
.card h2 { margin: 0; font-size: 15px }
.card .sub { margin: 4px 0 14px; font-size: 12.5px; color: var(--faint); max-width: 70ch }
.chart { display: flex; align-items: flex-end; gap: 12px; height: 150px; border-bottom: 1px solid var(--line-2); padding-inline: 4px }
.chart .wk { flex: 1 1 0; display: flex; justify-content: center; align-items: flex-end; gap: 4px; min-width: 0 }
.chart i { display: block; width: 16px; border-radius: 4px 4px 0 0 }
.axis { display: flex; gap: 12px; padding: 6px 4px 0 }
.axis span { flex: 1 1 0; text-align: center; font: 10.5px var(--mono); color: var(--faint); min-width: 0 }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block }
.chips { display: flex; flex-wrap: wrap; gap: 4px }
.chip { min-height: 30px; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--line-2); background: transparent; color: var(--fg-2) }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold) }
.hbar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin-top: 4px }
.hbar i { display: block; height: 10px; border-radius: 5px }
.row { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px }
.stack { display: flex; flex-direction: column; gap: 12px }
.stat3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px }
.stat4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px }
.stat small { display: block; font-size: 11px; color: var(--faint) }
.stat b { font: 600 22px var(--mono) }
.tags { display: flex; flex-wrap: wrap; gap: 6px }
.tag { font: 11px var(--mono); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--fg-2) }
table { width: 100%; border-collapse: collapse }
th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 500; padding: 0 0 6px; border-bottom: 1px solid var(--line) }
td { padding: 9px 0; border-bottom: 1px solid #121b29; font-size: 13px; vertical-align: middle }
td.num, th.num { text-align: right }
.loadbar { display: flex; align-items: center; gap: 8px }
.loadbar .hbar { flex: 1 1 auto; height: 8px; margin: 0 }
.loadbar .hbar i { height: 8px }
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; margin-bottom: 14px }
.stages div { border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; text-align: center }
.stages b { display: block; font: 600 20px var(--mono) }
.stages span { font-size: 11px }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line) }
.split i { display: block; height: 12px }
.funnel { display: flex; flex-direction: column; gap: 8px }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) 80px; gap: 10px; align-items: center }
.fbar { height: 30px; border-radius: 6px; background: #13203a; position: relative; overflow: hidden }
.fbar i { display: block; height: 30px; background: rgba(121,196,255,.28) }
.fbar span { position: absolute; left: 10px; top: 6px; font-size: 12.5px }
.call { border: 1px solid var(--line-2); border-radius: 10px; padding: 12px; font-size: 13px }
.call b { font: 600 18px var(--mono) }
.call.warn { border-color: rgba(255,143,107,.45); background: rgba(255,143,107,.06) } .call.warn b { color: var(--warn) }
.call.gold { border-color: rgba(233,200,119,.45); background: rgba(233,200,119,.06) } .call.gold b { color: var(--gold) }
.call.ok b { color: var(--ok) }
.cite { font: 11px var(--mono); color: var(--ghost); margin-top: 4px }
footer { border-top: 1px solid var(--line); padding-top: 12px; font-size: 12px; color: var(--faint); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px }
@media (max-width: 640px) { .stat3, .stat4 { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
</style>
</head>

</main>

        '<div class="legend"><span><span class="sw" style="background:var(--blue)"></span>Opened</span><span><span class="sw" style="background:var(--gold)"></span>Decided</span></div></section>' +
      '<section class="card"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline"><h2>Backlog aging by band</h2><div class="chips">' + chips + '</div></div><p class="sub">Days since opening, for the ' + tot + ' open cases in view.</p><div class="stack">' + aging + '</div></section>' +
      '<section class="card"><h2>SLA position</h2><p class="sub">Time in a case\'s current state against its band\'s limit (' + Object.keys(D.sla_days).map(function (b) { return b + " " + D.sla_days[b] + "d"; }).join(", ") + '). Every breach is routed to the supervisor; the sweep never changes the case itself.</p>' +
        '<div class="stat3"><div class="stat"><small>Open</small><b style="color:var(--warn)">' + D.breaches_open + '</b></div><div class="stat"><small>Resolved</small><b style="color:var(--ok)">' + (D.breaches_recorded - D.breaches_open) + '</b></div><div class="stat"><small>Recorded</small><b>' + D.breaches_recorded + '</b></div></div>' +
        '<div style="font-size:12px;color:var(--muted);margin-bottom:6px">Open breaches by band</div><div class="stack" style="gap:8px;margin-bottom:14px">' + breachRows + '</div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">Every breach, by the clock that ran out</div><div class="tags">' + clocks + '</div></section>' +
      '<section class="card"><h2>Team workload and throughput</h2><p class="sub">Open cases per analyst against the allocation cap, with investigations started and cases sent to QA. Decisions are taken by a second reviewer.</p><div style="overflow-x:auto"><table style="min-width:400px"><thead><tr><th>Analyst</th><th>Open load</th><th class="num">Started</th><th class="num">To QA</th></tr></thead><tbody>' + team + '</tbody></table></div>' +
        '<div class="legend" style="color:var(--fg-2);font-size:12.5px"><span>Unassigned <b class="mono" style="color:var(--warn)">' + D.unassigned + '</b></span><span>Four-eyes flags <b class="mono" style="color:' + (D.four_eyes_flags ? "var(--warn)" : "var(--ok)") + '">' + D.four_eyes_flags + '</b></span></div></section>' +
      '<section class="card"><h2>SAR pipeline and deadlines</h2><p class="sub">Referrals to the nominated officer and their policy clocks. The register is the authority on whether a SAR reached the regulator.</p><div class="stages">' + stages + '</div><div class="stack">' + dls + '</div></section>' +
      '<section class="card"><h2>Quality oversight</h2><p class="sub">Second-line review of decisions already taken: mandatory classes at 100%, then a chain-seeded random sample. The reviewer must be independent of the case.</p>' +
        '<div class="stat4"><div class="stat"><small>Selected</small><b>' + D.qa.length + '</b></div><div class="stat"><small>Pass</small><b style="color:var(--ok)">' + qaCount("pass") + '</b></div><div class="stat"><small>Observation</small><b style="color:var(--gold)">' + qaCount("observation") + '</b></div><div class="stat"><small>Fail</small><b style="color:var(--warn)">' + qaCount("fail") + '</b></div></div><div class="stack" style="gap:6px;font-size:12.5px">' + qaRows + '</div></section>';
    document.querySelectorAll("[data-band]").forEach(function (b) { b.addEventListener("click", function () { ui.band = b.getAttribute("data-band"); render(); }); });
    $("source").textContent = "Source: the case event log, " + D.events + " events to " + D.as_of + " (head " + D.head.slice(0, 12) + "…), via the governed ledger replay.";
  }

  function batchView() {
    var F = B.figures;
    var v = function (k) { return F[k].value; };
    $("asOf").textContent = B.label;
    $("headline").textContent = "At scale, the officer review is the constraint.";
    $("subline").textContent = "One governed batch over a synthetic estate of " + fmt(v("entities")) + " entities. Simulated analysts, nominated officer and QA reviewer act by governed rule, so these figures measure the operating model rather than any one person.";
    $("kpis").innerHTML = kpiHtml([
      ["Entities", fmt(v("entities")), "on the batch queue", "var(--fg)"],
      ["Products made", fmt(v("products")), "one per alert manufactured", "var(--ok)"],
      ["Cases opened", fmt(v("cases_opened")), fmt(v("master_cases")) + " fused master cases", "var(--fg)"],
      ["SARs referred", fmt(v("sars_referred")), fmt(v("sars_acknowledged")) + " acknowledged · " + fmt(v("sars_officer_review")) + " in officer review", "var(--gold)"],
      ["Overdue", fmt(v("sars_overdue")), "officer reviews past deadline", "var(--warn)"],
      ["Sanctions lane", fmt(v("sanctions_lane_open")), "open, visible, not yet worked", "var(--gold)"]
    ]);
    var steps = [["Entities on the queue", "entities"], ["Products manufactured", "products"], ["Cases opened", "cases_opened"], ["Decisions taken", "decisions"], ["SARs referred to the officer", "sars_referred"], ["Acknowledged by the FIU", "sars_acknowledged"]];
    var top = Math.log10(v("entities") + 1);
    var funnel = steps.map(function (st) {
      return '<div class="frow"><div class="fbar"><i style="width:' + Math.max(1.5, Math.log10(v(st[1]) + 1) / top * 100) + '%"></i><span>' + esc(st[0]) + '</span></div><span class="mono" style="text-align:right;font-size:15px">' + fmt(v(st[1])) + '</span></div>';
    }).join("");
    var cite = function (k) { return '<div class="cite">' + esc(F[k].document) + '</div>'; };
    $("panels").innerHTML =
      '<section class="card"><h2>From estate to regulator</h2><p class="sub">Every subject scored, every alert manufactured, then the operating model works the cases by rule. Bar lengths are on a log scale.</p><div class="funnel">' + funnel + '</div></section>' +
      '<section class="card"><h2>Where the pressure is</h2><p class="sub">What a head of operations would act on after this run.</p><div class="stack">' +
        '<div class="call warn"><b>' + fmt(v("sars_overdue")) + ' of ' + fmt(v("sars_officer_review")) + '</b> SARs in officer review are overdue. The nominated officer\'s daily action budget is the bottleneck, not analyst decisions.' + cite("sars_overdue") + '</div>' +
        '<div class="call gold"><b>' + fmt(v("sanctions_lane_open")) + '</b> sanctions-lane cases are open and breaching. By design: the lane is visible but not worked until the sanctions-operations workflow is built.' + cite("sanctions_lane_open") + '</div>' +
        '<div class="call"><b>' + esc(v("allocations_per_offset")) + '</b> allocations at each operations run: five analysts at a cap of five, so the cap, not the decision rate, sets throughput.' + cite("allocations_per_offset") + '</div>' +
        '<div class="call ok"><b>' + fmt(v("qa_fails")) + '</b> QA fails and <b>' + fmt(v("four_eyes_flags")) + '</b> four-eyes flags across ' + fmt(v("qa_selections")) + ' reviews (' + fmt(v("qa_observations")) + ' observations).' + cite("qa_selections") + '</div>' +
      '</div></section>';
    $("source").textContent = "Source: " + B.sources.join("; ") + ". Every figure in this view is quoted from those evidence documents.";
  }

  function render() {
    $("scopeDesk").setAttribute("aria-pressed", String(ui.scope === "desk"));
    $("scopeBatch").setAttribute("aria-pressed", String(ui.scope === "batch"));
    if (ui.scope === "desk") deskView(); else batchView();
  }
  function setScope(sc) { ui.scope = sc; try { localStorage.setItem("nexus-mi-scope", sc); } catch (e) { /* ignore */ } render(); }
  $("scopeDesk").addEventListener("click", function () { setScope("desk"); });
  $("scopeBatch").addEventListener("click", function () { setScope("batch"); });
  render();
})();
</script>
</body>
</html>
