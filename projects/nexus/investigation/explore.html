  const sel=document.getElementById("typefilter"); sel.innerHTML='<option value="">All types</option>';
  const LABEL={person:"Individual",company:"Company"};
  for(const ty of [...new Set(nb.nodes.map(n=>n.type).filter(Boolean))].sort()){
    const o=document.createElement("option"); o.value=ty; o.textContent=LABEL[ty]||ty.replace(/_/g," "); sel.appendChild(o); }
  sel.value=""; sel.onchange=()=>{ FILT.type=sel.value; applyHighlight(); };
  document.querySelectorAll("#riskfloor button").forEach(bt=>{ bt.setAttribute("aria-pressed", bt.dataset.r==="0"?"true":"false");
    bt.onclick=()=>{ FILT.risk=+bt.dataset.r; document.querySelectorAll("#riskfloor button").forEach(x=>x.setAttribute("aria-pressed", x===bt?"true":"false")); applyHighlight(); }; });
  document.getElementById("clearfilters").onclick=()=>{ buildFilterBar(nb); };
  applyHighlight();
}
function band(r){r=r||0; return r>=80?["b-crit","Critical"]:r>=60?["b-high","High"]:r>=30?["b-med","Medium"]:["b-low","Low"];}
function renderPanel(res){
  const [bc,bl]=band(res.risk_score);
  panel.innerHTML=`<h2>${esc(res.label||res.entity_key)}</h2>
    <div><span class="badge ${bc}">${esc(bl)} · ${esc(res.risk_score??"?")}</span> <span class=chip>${esc(res.type||"")}</span></div>
    <div class=k>Flagged by</div>${(res.flagged_by||[]).map(p=>`<span class=chip>${esc(p)}</span>`).join("")||"&mdash;"}
    <div class=k>Resolved from</div>${(res.resolved_from||[]).map(p=>`<span class=chip>${esc(p)}</span>`).join("")||"&mdash;"}
    <div class=k>Entity key</div><code>${esc(res.entity_key)}</code>`;
}
// showEntity: render an entity we ALREADY have the entity_key for (e.g. a clicked graph
// node) directly from the neighbourhood response's `center` — no re-resolution through
// name normalisation, so a node click can never "no match" on its own entity_key.
async function showEntity(key){
  const nb=await client.neighbourhood(key,2);
  if(nb && nb.storeUnavailable){ return; }                     // banner already rendered by the client
  if(!nb || !nb.center){ panel.innerHTML="<h2>No match</h2>"; svg.innerHTML=""; return; }
  renderPanel(nb.center); drawGraph(nb, key);
}
function drawGraph(nb, centerKey){
  const W=svg.clientWidth||900, H=svg.clientHeight||600;
  const nodes=nb.nodes.map(n=>Object.assign({}, n, {x:W/2+(Math.random()-.5)*300, y:H/2+(Math.random()-.5)*300, vx:0, vy:0}));
  const byKey=Object.fromEntries(nodes.map(n=>[n.entity_key,n]));
  const links=nb.edges.map(e=>({s:byKey[e.source],t:byKey[e.target],rel:e.relationship})).filter(l=>l.s&&l.t);
  for(let it=0; it<180; it++){                                   // simple force layout
    for(const a of nodes){ for(const b of nodes){ if(a===b)continue; let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;
      const f=1400/(d*d); a.vx+=dx/d*f; a.vy+=dy/d*f; } a.vx+=(W/2-a.x)*0.01; a.vy+=(H/2-a.y)*0.01; }
    for(const l of links){ let dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.hypot(dx,dy)||1,f=(d-110)*0.05;
      l.s.vx+=dx/d*f; l.s.vy+=dy/d*f; l.t.vx-=dx/d*f; l.t.vy-=dy/d*f; }
    for(const n of nodes){ n.x+=n.vx*=0.85; n.y+=n.vy*=0.85; n.x=Math.max(30,Math.min(W-30,n.x)); n.y=Math.max(30,Math.min(H-30,n.y)); }
  }
  // COLLIDE: separate overlapping nodes so labels/circles don't stack (bounded)
  const R = n => (n.entity_key===centerKey?16:11), PAD = 14;
  for(let pass=0; pass<60; pass++){ let moved=false;
    for(const a of nodes){ for(const b of nodes){ if(a===b) continue;
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.01, min=R(a)+R(b)+PAD;
      if(d<min){ const push=(min-d)/2/d; dx*=push; dy*=push;
        a.x-=dx; a.y-=dy; b.x+=dx; b.y+=dy; moved=true; } } }
    for(const n of nodes){ n.x=Math.max(30,Math.min(W-30,n.x)); n.y=Math.max(30,Math.min(H-30,n.y)); }
    if(!moved) break;
  }
  const svgns="http://www.w3.org/2000/svg"; svg.innerHTML="";
  RENDER = { nodes:[], edges:[], centerKey:centerKey };
  const ln_of = l => l.line;
  for(const l of links){ const ln=document.createElementNS(svgns,"line"); ln.setAttribute("class","edge");
    ln.setAttribute("x1",l.s.x);ln.setAttribute("y1",l.s.y);ln.setAttribute("x2",l.t.x);ln.setAttribute("y2",l.t.y);
    l.line=ln; svg.appendChild(ln); RENDER.edges.push({data:l, line:ln}); }
  for(const n of nodes){ const g=document.createElementNS(svgns,"g");
    g.setAttribute("class","node"+(n.entity_key===centerKey?" center":"")); g.setAttribute("tabindex","0");
    g.setAttribute("role","button"); g.setAttribute("aria-label",(n.label||n.entity_key)+", risk "+(n.risk_score??"unknown"));
    const c=document.createElementNS(svgns,"circle"); c.setAttribute("cx",n.x);c.setAttribute("cy",n.y);
    c.setAttribute("r", n.entity_key===centerKey?16:11); c.setAttribute("fill", band(n.risk_score)[0]==="b-crit"?"#c0202a":band(n.risk_score)[0]==="b-high"?"#d4772a":band(n.risk_score)[0]==="b-med"?"#c8a53a":"#2e8b57");
    const t=document.createElementNS(svgns,"text"); t.setAttribute("x",n.x+14);t.setAttribute("y",n.y+4); t.textContent=n.label||n.entity_key;
    g.appendChild(c); g.appendChild(t);
    // drag + pin: pointer drag repositions the node (edges follow) and pins it; a real drag
    // suppresses the click-navigate. Keyboard activation is unchanged.
    let dragging=false, moved=false, sx=0, sy=0;
    g.style.cursor="grab";
    g.addEventListener("pointerdown", e=>{ dragging=true; moved=false; sx=e.clientX; sy=e.clientY;
      g.setPointerCapture(e.pointerId); g.style.cursor="grabbing"; e.preventDefault(); });
    g.addEventListener("pointermove", e=>{ if(!dragging) return;
      const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
      const p=pt.matrixTransform(svg.getScreenCTM().inverse());
      if(Math.hypot(e.clientX-sx, e.clientY-sy)>3) moved=true;
      n.x=p.x; n.y=p.y; n.pinned=true;
      c.setAttribute("cx",n.x); c.setAttribute("cy",n.y);
      t.setAttribute("x",n.x+14); t.setAttribute("y",n.y+4);
      for(const l of links){ if(l.s===n||l.t===n){ ln_of(l).setAttribute("x1",l.s.x);
        ln_of(l).setAttribute("y1",l.s.y); ln_of(l).setAttribute("x2",l.t.x); ln_of(l).setAttribute("y2",l.t.y); } } });
    g.addEventListener("pointerup", e=>{ dragging=false; g.style.cursor="grab"; });
    // node click/keyboard-activate goes straight to showEntity(n.entity_key) -- the node
    // already carries its own entity_key, so this must NOT re-resolve via the display label.
    const go=()=>showEntity(n.entity_key);
    g.addEventListener("click",e=>{ if(moved){ moved=false; return; } go(); });
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
    svg.appendChild(g); RENDER.nodes.push({data:n, g:g, c:c, t:t}); }
  buildFilterBar(nb);
}
// deep-link focus: opening the page with #<entity_key> lands directly on that entity
// (used by the workspace bundle's dossier -> explore.html#<CE-id> links). An empty or
// absent hash keeps the normal "start typing" state; a non-empty hash always calls
// showEntity(), which renders the entity if the key resolves, or "No match" if it doesn't.
if(typeof location !== 'undefined'){ (function(){ var h=decodeURIComponent((location.hash||"").replace(/^#/,"")); if(h){ showEntity(h); } })(); }
</script></body></html>
